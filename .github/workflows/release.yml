name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            build: npm run dist
            cache: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
          - os: ubuntu-latest
            platform: linux
            build: npm run dist:linux
            cache: |
              ~/.cache/electron
              ~/.cache/electron-builder
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build
        run: ${{ matrix.build }}

      - name: Verify artifact
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${{ matrix.platform }}" = "linux" ]; then
            file="dist/friends-meet-$version-linux-amd64.deb"
          else
            file="dist/friends-meet-$version-win-x64-portable.exe"
          fi
          test -f "$file" || { echo "::error::missing $file"; exit 1; }
          sha="$(sha256sum "$file" | cut -d' ' -f1)"
          printf '%s  %s\n' "$sha" "$(basename "$file")" > "$file.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$(basename "$file")" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Validate deb package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          deb="dist/${{ steps.meta.outputs.file }}"
          echo "--- control ---"
          dpkg-deb -f "$deb" Package Version Architecture Maintainer Homepage Depends Recommends Section Priority
          echo "--- contents ---"
          dpkg-deb -c "$deb" | grep -E 'opt/.*/friends-meet$|applications/friends-meet\.desktop|icons/.*/friends-meet\.png' || {
            echo "::error::deb missing expected files";
            exit 1;
          }
          echo "--- install ---"
          sudo apt-get install -y "./$deb"
          dpkg -s friends-meet | grep -E '^(Package|Status|Version|Architecture):'
          dpkg -L friends-meet | grep -E '/opt/.*/friends-meet$|applications/friends-meet\.desktop|icons/.*/friends-meet\.png'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: friends-meet-${{ steps.meta.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/${{ steps.meta.outputs.file }}
            dist/${{ steps.meta.outputs.file }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          win="$(find release-assets -maxdepth 1 -type f -name 'friends-meet-*-win-x64-portable.exe' | head -1)"
          deb="$(find release-assets -maxdepth 1 -type f -name 'friends-meet-*-linux-amd64.deb' | head -1)"
          test -n "$win" || { echo "::error::missing Windows exe"; exit 1; }
          test -n "$deb" || { echo "::error::missing Linux deb"; exit 1; }
          (cd release-assets && sha256sum -c "$(basename "$win").sha256")
          (cd release-assets && sha256sum -c "$(basename "$deb").sha256")
          win_sha="$(sha256sum "$win" | cut -d' ' -f1)"
          deb_sha="$(sha256sum "$deb" | cut -d' ' -f1)"
          node tools/release-notes.js "$version" \
            --notes-out release-notes.md \
            --title-out release-title.txt \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --win-name "$(basename "$win")" \
            --win-sha "$win_sha" \
            --linux-name "$(basename "$deb")" \
            --linux-sha "$deb_sha"
          title="$(cat release-title.txt)"
          assets=("$win" "$win.sha256" "$deb" "$deb.sha256")
          is_draft="$(gh release list --limit 100 --json tagName,isDraft --jq ".[] | select(.tagName == \"$GITHUB_REF_NAME\") | .isDraft" | head -1)"
          if [ -n "$is_draft" ]; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::release $GITHUB_REF_NAME 已发布，禁止自动修改；请发 patch 版本"
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft --verify-tag \
              --title "$title" \
              --notes-file release-notes.md \
              "${assets[@]}"
          fi
          echo "Draft release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
